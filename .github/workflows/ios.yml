name: CoCode iOS

on:
  push:
    branches: [main, 'ios/**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNARIUM_REV: b14aa9e6da9df15f467d8aad0090888373cc9b21

jobs:
  guest:
    name: ARM64 Cox guest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and check guest filesystem
        run: |
          docker buildx build --platform linux/arm64 --target bundle \
            --output type=local,dest=build/ios/guest --progress plain ios/guest
          cd build/ios/guest
          sha256sum cocode-linux.erofs > cocode-linux.erofs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CoCode-iOS-ARM64-guest
          path: build/ios/guest/
          if-no-files-found: error
          compression-level: 0

  boot-base:
    name: ARM64 boot ramdisk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ env.KERNARIUM_REV }}
          persist-credentials: false
      - name: Restore boot ramdisk
        id: boot-cache
        uses: actions/cache@v4
        with:
          path: boot-output
          key: ios-boot-base-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}
      - name: Build boot ramdisk from pinned source
        if: steps.boot-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio debootstrap file flex gdisk rsync unzip wget
          tools/rootfs/starter/build-all.sh --product boot-base-aarch64 \
            --work "$RUNNER_TEMP/kernarium-boot-work" --output "$GITHUB_WORKSPACE/boot-output"
      - name: Record boot ramdisk checksum
        working-directory: boot-output
        run: |
          gzip -t uml-boot-base-aarch64.cpio.gz
          sha256sum uml-boot-base-aarch64.cpio.gz > uml-boot-base-aarch64.cpio.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kernarium-arm64-boot-base
          path: |
            boot-output/uml-boot-base-aarch64.cpio.gz
            boot-output/uml-boot-base-aarch64.cpio.gz.sha256
          if-no-files-found: error

  ipa:
    name: Unsigned iOS IPA
    needs: [guest, boot-base]
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ env.KERNARIUM_REV }}
          path: kernarium
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CoCode-iOS-ARM64-guest
          path: build/ios/guest
      - uses: actions/download-artifact@v4
        with:
          name: kernarium-arm64-boot-base
          path: build/ios/boot
      - name: Verify build inputs
        id: toolchain
        run: |
          (cd build/ios/guest && shasum -a 256 -c cocode-linux.erofs.sha256)
          (cd build/ios/boot && shasum -a 256 -c uml-boot-base-aarch64.cpio.gz.sha256)
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          printf 'sdk=%s\n' "$sdk" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Apple build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install autoconf automake bison flex gettext groff gperf libtool lld llvm make ninja pkgconf rsync
          for package in bison flex gettext groff libtool lld llvm; do
            printf '%s/bin\n' "$(brew --prefix "$package")" >> "$GITHUB_PATH"
          done
          python3 -m pip install meson mako pyyaml packaging
          xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache/restore@v4
        id: kernels
        with:
          path: build/ios/host-kernels
          key: ios-darwin-kernels-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sdk }}
      - name: Build and package CoCode
        env:
          COCODE_IOS_ARCHIVE_ZIP: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('{0}/CoCode.xcarchive.zip', runner.temp) || '' }}
          COCODE_IOS_KERNEL_CACHE_DIR: ${{ github.workspace }}/build/ios/host-kernels
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: user.name
          GIT_CONFIG_VALUE_0: github-actions[bot]
          GIT_CONFIG_KEY_1: user.email
          GIT_CONFIG_VALUE_1: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export BOOT_BASE_SHA256=$(awk 'NR == 1 {print $1}' build/ios/boot/uml-boot-base-aarch64.cpio.gz.sha256)
          bash ios/host/build-package.sh kernarium build/ios/boot \
            build/ios/guest/cocode-linux.erofs build/ios/package
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.kernels.outputs.cache-hit != 'true' && hashFiles('build/ios/host-kernels/*/kernel-artifact.json') != '' }}
        with:
          path: build/ios/host-kernels
          key: ${{ steps.kernels.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: CoCode-iOS-unsigned
          path: build/ios/package/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: CoCode-iOS-archive
          path: ${{ runner.temp }}/CoCode.xcarchive.zip
          retention-days: 1
          if-no-files-found: error

  testflight:
    name: Sign and upload to internal TestFlight
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ipa
    runs-on: xcode-27
    environment: testflight
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CoCode-iOS-archive
          path: ${{ runner.temp }}
      - name: Export with Apple-managed signing and upload
        working-directory: ${{ runner.temp }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$API_KEY" > "$key"
          unset API_KEY
          ditto -x -k CoCode.xcarchive.zip .
          plutil -create xml1 ExportOptions.plist
          plutil -insert method -string app-store-connect ExportOptions.plist
          plutil -insert destination -string export ExportOptions.plist
          plutil -insert teamID -string "$TEAM_ID" ExportOptions.plist
          plutil -insert signingStyle -string automatic ExportOptions.plist
          plutil -insert testFlightInternalTestingOnly -bool YES ExportOptions.plist
          export_archive() {
            xcodebuild -exportArchive -archivePath CoCode.xcarchive \
              -exportPath "$1" -exportOptionsPlist ExportOptions.plist \
              -allowProvisioningUpdates -authenticationKeyPath "$key" \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          }
          export_archive signed
          ditto -x -k signed/*.ipa verified
          app=(verified/Payload/*.app)
          codesign --verify --deep --strict "${app[0]}"
          codesign -d --entitlements :- "${app[0]}" > entitlements.plist
          security cms -D -i "${app[0]}/embedded.mobileprovision" > profile.plist
          python3 - <<'PYTHON'
          import os
          import plistlib
          from pathlib import Path

          signature = plistlib.loads(Path("entitlements.plist").read_bytes())
          profile = plistlib.loads(Path("profile.plist").read_bytes())["Entitlements"]
          for data in (signature, profile):
              if data.get("application-identifier") != os.environ["TEAM_ID"] + ".io.cocode.ios":
                  raise SystemExit("Unexpected signed application identifier")
              for capability in ("extended-virtual-addressing", "increased-memory-limit"):
                  if data.get("com.apple.developer.kernel." + capability) is not True:
                      raise SystemExit("Missing memory entitlement: " + capability)
          PYTHON
          plutil -replace destination -string upload ExportOptions.plist
          export_archive upload
