name: CoCode iOS

on:
  push:
    branches: [main, 'ios/**']
    tags: ['ios-v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KERNARIUM_REV: b14aa9e6da9df15f467d8aad0090888373cc9b21

jobs:
  guest:
    name: ARM64 Linux image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL_TAG: ios-image-channel
      CHANNEL_ASSET: CoCodeGuest-v2.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Choose the release for this build
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            tag=$GITHUB_REF_NAME publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] || [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag=ios-build-$GITHUB_RUN_NUMBER publish=true
          else
            tag=ios-preview-$GITHUB_RUN_NUMBER publish=false
          fi
          # A tag names its own version. Every other build is the next patch after the newest
          # ios-vX.Y.Z tag; the run number is the build number, so each build is distinct.
          tags=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'refs/tags/ios-v*')
          latest=$(printf '%s\n' "$tags" | sed -n 's#^.*refs/tags/ios-v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -n 1)
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            version=${GITHUB_REF_NAME#ios-v}
          elif [[ -n "$latest" ]]; then
            IFS=. read -r major minor patch <<< "$latest"
            version=$major.$minor.$((patch + 1))
          else
            version=0.1.0
          fi
          # The channel names the newest image for every app; only main and release tags move it.
          channel=false
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/ios-v* ]] && [[ "$publish" == true ]]; then
            channel=true
          fi
          printf 'tag=%s\npublish=%s\nversion=%s\nbuild=%s\nchannel=%s\n' "$tag" "$publish" "$version" "$GITHUB_RUN_NUMBER" "$channel" >> "$GITHUB_OUTPUT"
          echo "CoCode iOS $version ($GITHUB_RUN_NUMBER), release $tag"
      - name: Reuse the published image when its source is unchanged
        id: reuse
        run: |
          mkdir -p build/ios/guest
          tree=$(git rev-parse HEAD:ios/guest)
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$CHANNEL_TAG/$CHANNEL_ASSET"
          if curl -fsSL --retry 3 --retry-all-errors -o channel.json "$url" &&
              python3 -c 'import json,sys; m=json.load(open("channel.json")); sys.exit(0 if m.get("guestTree") == sys.argv[1] and m.get("format") == 2 else 1)' "$tree"; then
            mv channel.json build/ios/guest/CoCodeGuest.json
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "The channel image was built from ios/guest $tree; reusing it."
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "ios/guest $tree has no published image; building one."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.reuse.outputs.reused != 'true'
      - name: Build and check the image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          docker buildx build --platform linux/arm64 --target bundle \
            --output type=local,dest=build/ios/guest --progress plain ios/guest
      - name: Compress the image and write its download manifest
        if: steps.reuse.outputs.reused != 'true'
        env:
          IMAGE_TAG: ios-image-${{ github.run_number }}
          TREE: ${{ steps.reuse.outputs.tree }}
        working-directory: build/ios/guest
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          zstd -19 -T0 --no-progress -o cocode-linux.erofs.zst cocode-linux.erofs
          zstd -t cocode-linux.erofs.zst
          python3 - "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$IMAGE_TAG/cocode-linux.erofs.zst" "$IMAGE_TAG" "$TREE" <<'PY'
          import hashlib, json, os, sys
          def digest(path):
              value = hashlib.sha256()
              with open(path, 'rb') as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b''):
                      value.update(chunk)
              return value.hexdigest()
          manifest = {
              'version': sys.argv[2],
              'url': sys.argv[1],
              'compressedSHA256': digest('cocode-linux.erofs.zst'),
              'compressedSize': os.path.getsize('cocode-linux.erofs.zst'),
              'imageSHA256': digest('cocode-linux.erofs'),
              'imageSize': os.path.getsize('cocode-linux.erofs'),
              'format': 2,
              'guestTree': sys.argv[3],
          }
          with open('CoCodeGuest.json', 'w', encoding='utf-8') as stream:
              json.dump(manifest, stream, indent=2)
              stream.write('\n')
          PY
          cat CoCodeGuest.json
          rm cocode-linux.erofs
      - name: Publish the image release
        if: steps.reuse.outputs.reused != 'true' && steps.release.outputs.publish == 'true'
        env:
          IMAGE_TAG: ios-image-${{ github.run_number }}
        working-directory: build/ios/guest
        run: |
          sha256sum cocode-linux.erofs.zst CoCodeGuest.json > SHA256SUMS
          assets=(cocode-linux.erofs.zst CoCodeGuest.json SHA256SUMS)
          # The releases API intermittently answers 403 to this token; retry, and finish a
          # release an earlier attempt created by uploading its assets again.
          for attempt in 1 2 3 4 5; do
            if gh release view "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}" && exit 0
            elif gh release create "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "CoCode iOS Linux image $IMAGE_TAG" \
                --notes "Linux image for CoCode iOS (format 2). CoCode downloads and verifies it; it does not change the installed Cox or agents." \
                "${assets[@]}"; then
              exit 0
            fi
            echo "Release attempt $attempt failed; retrying"
            sleep $(( attempt * 20 ))
          done
          exit 1
      - name: Verify the image downloads without credentials
        if: steps.release.outputs.publish == 'true'
        working-directory: build/ios/guest
        run: |
          url=$(python3 -c 'import json; print(json.load(open("CoCodeGuest.json"))["url"])')
          expected=$(python3 -c 'import json; print(json.load(open("CoCodeGuest.json"))["compressedSHA256"])')
          env -u GH_TOKEN curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/anonymous.zst" "$url"
          test "$(sha256sum "$RUNNER_TEMP/anonymous.zst" | awk '{print $1}')" = "$expected"
          echo "Anonymous download verified: $url"
      - name: Point the channel at this image
        if: steps.reuse.outputs.reused != 'true' && steps.release.outputs.channel == 'true'
        working-directory: build/ios/guest
        run: |
          cp CoCodeGuest.json "$CHANNEL_ASSET"
          for attempt in 1 2 3 4 5; do
            if gh release view "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$CHANNEL_ASSET" && break
            elif gh release create "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "CoCode iOS Linux image channel" \
                --notes "$CHANNEL_ASSET names the newest format 2 Linux image. CoCode iOS checks it for image updates." \
                "$CHANNEL_ASSET"; then
              break
            fi
            echo "Channel attempt $attempt failed; retrying"
            sleep $(( attempt * 20 ))
            [[ $attempt == 5 ]] && exit 1
          done
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$CHANNEL_TAG/$CHANNEL_ASSET"
          for attempt in 1 2 3 4 5 6; do
            env -u GH_TOKEN curl -fsSL -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/channel.json" "$url" &&
              cmp "$RUNNER_TEMP/channel.json" "$CHANNEL_ASSET" && { echo "Channel verified: $url"; exit 0; }
            sleep $(( attempt * 10 ))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: CoCode-iOS-guest-manifest
          path: build/ios/guest/CoCodeGuest.json
          if-no-files-found: error

  boot-base:
    name: ARM64 boot ramdisk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ env.KERNARIUM_REV }}
          persist-credentials: false
      - name: Restore boot ramdisk
        id: boot-cache
        uses: actions/cache@v4
        with:
          path: boot-output
          key: ios-boot-base-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}
      - name: Build boot ramdisk from pinned source
        if: steps.boot-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio debootstrap file flex gdisk rsync unzip wget
          tools/rootfs/starter/build-all.sh --product boot-base-aarch64 \
            --work "$RUNNER_TEMP/kernarium-boot-work" --output "$GITHUB_WORKSPACE/boot-output"
      - name: Record boot ramdisk checksum
        working-directory: boot-output
        run: |
          gzip -t uml-boot-base-aarch64.cpio.gz
          sha256sum uml-boot-base-aarch64.cpio.gz > uml-boot-base-aarch64.cpio.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kernarium-arm64-boot-base
          path: |
            boot-output/uml-boot-base-aarch64.cpio.gz
            boot-output/uml-boot-base-aarch64.cpio.gz.sha256
          if-no-files-found: error

  ipa:
    name: Unsigned iOS IPA
    needs: [guest, boot-base]
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ env.KERNARIUM_REV }}
          path: kernarium
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CoCode-iOS-guest-manifest
          path: build/ios/guest
      - uses: actions/download-artifact@v4
        with:
          name: kernarium-arm64-boot-base
          path: build/ios/boot
      - name: Verify build inputs
        id: toolchain
        run: |
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["compressedSize"] > 0 and m["format"] == 2' build/ios/guest/CoCodeGuest.json
          (cd build/ios/boot && shasum -a 256 -c uml-boot-base-aarch64.cpio.gz.sha256)
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          printf 'sdk=%s\n' "$sdk" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Apple build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install autoconf automake bison flex gettext groff gperf libtool lld llvm make ninja pkgconf rsync
          for package in bison flex gettext groff libtool lld llvm; do
            printf '%s/bin\n' "$(brew --prefix "$package")" >> "$GITHUB_PATH"
          done
          python3 -m pip install meson mako pyyaml packaging
          xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache/restore@v4
        id: kernels
        with:
          path: build/ios/host-kernels
          key: ios-darwin-kernels-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sdk }}
      - name: Build and package CoCode
        env:
          COCODE_IOS_ARCHIVE_ZIP: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('{0}/CoCode.xcarchive.zip', runner.temp) || '' }}
          COCODE_IOS_VERSION: ${{ needs.guest.outputs.version }}
          COCODE_IOS_BUILD_NUMBER: ${{ needs.guest.outputs.build }}
          COCODE_IOS_KERNEL_CACHE_DIR: ${{ github.workspace }}/build/ios/host-kernels
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: user.name
          GIT_CONFIG_VALUE_0: github-actions[bot]
          GIT_CONFIG_KEY_1: user.email
          GIT_CONFIG_VALUE_1: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export BOOT_BASE_SHA256=$(awk 'NR == 1 {print $1}' build/ios/boot/uml-boot-base-aarch64.cpio.gz.sha256)
          bash ios/host/build-package.sh kernarium build/ios/boot \
            build/ios/guest/CoCodeGuest.json build/ios/package
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.kernels.outputs.cache-hit != 'true' && hashFiles('build/ios/host-kernels/*/kernel-artifact.json') != '' }}
        with:
          path: build/ios/host-kernels
          key: ${{ steps.kernels.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: CoCode-iOS-unsigned
          path: build/ios/package/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: CoCode-iOS-archive
          path: ${{ runner.temp }}/CoCode.xcarchive.zip
          retention-days: 1
          if-no-files-found: error

  testflight:
    name: Sign and upload to internal TestFlight
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ipa
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ios-testflight.yml
    secrets: inherit
    with:
      archive_run_id: ${{ format('{0}', github.run_id) }}

  release:
    name: Publish GitHub Release
    needs: [guest, ipa]
    if: ${{ needs.guest.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.guest.outputs.tag }}
      VERSION: ${{ needs.guest.outputs.version }}
      BUILD: ${{ needs.guest.outputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CoCode-iOS-guest-manifest
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: CoCode-iOS-unsigned
          path: package
      - name: Publish the unsigned IPA
        working-directory: release
        run: |
          (cd ../package && shasum -a 256 -c SHA256SUMS)
          mv ../package/CoCode-unsigned.ipa .
          cmp CoCodeGuest.json <(unzip -p CoCode-unsigned.ipa Payload/CoCode.app/CoCodeGuest.json)
          sha256sum CoCode-unsigned.ipa CoCodeGuest.json > SHA256SUMS
          prerelease=--prerelease
          [[ "$TAG" == ios-v* && "$TAG" != ios-v0.* ]] && prerelease=
          assets=(CoCode-unsigned.ipa CoCodeGuest.json SHA256SUMS)
          # The releases API intermittently answers 403 to this token; retry, and finish a
          # release an earlier attempt created by uploading its assets again.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}" && exit 0
            elif gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $prerelease \
                --title "CoCode iOS $VERSION ($BUILD)" \
                --notes "Unsigned CoCode iOS build. Sign CoCode-unsigned.ipa before installing. On first launch CoCode downloads the Linux image named in CoCodeGuest.json and verifies it. The image, Cox and the agents update separately from the app." \
                "${assets[@]}"; then
              exit 0
            fi
            echo "Release attempt $attempt failed; retrying"
            sleep $(( attempt * 20 ))
          done
          exit 1
      - name: Verify the image downloads without credentials
        working-directory: release
        run: |
          url=$(python3 -c 'import json; print(json.load(open("CoCodeGuest.json"))["url"])')
          expected=$(python3 -c 'import json; print(json.load(open("CoCodeGuest.json"))["compressedSHA256"])')
          env -u GH_TOKEN curl -fsSL --retry 5 --retry-all-errors -o anonymous.zst "$url"
          test "$(sha256sum anonymous.zst | awk '{print $1}')" = "$expected"
          echo "Anonymous download verified: $url"
