name: CoCode iOS Simulator QA

on:
  push:
    branches: ['ios/simulator-qa']
  workflow_dispatch:
    inputs:
      manifest_tag:
        description: Public iOS release tag containing CoCodeGuest.json
        required: true
        default: ios-v1.0.1
        type: string
      only_testing:
        description: Optional xcodebuild -only-testing value (empty skips tests)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ios-simulator-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNARIUM_REV: b14aa9e6da9df15f467d8aad0090888373cc9b21
  MANIFEST_TAG: ${{ inputs.manifest_tag || 'ios-v1.0.1' }}
  ONLY_TESTING: ${{ github.event_name == 'push' && 'KernariumTests/CoCodeSessionTests KernariumUITests/CoCodeHomeUITests' || inputs.only_testing }}

jobs:
  boot-base:
    name: ARM64 boot ramdisk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ env.KERNARIUM_REV }}
          persist-credentials: false
      - name: Restore boot ramdisk
        id: boot-cache
        uses: actions/cache@v4
        with:
          path: boot-output
          key: ios-boot-base-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}
      - name: Build boot ramdisk from pinned source
        if: steps.boot-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio debootstrap file flex gdisk rsync unzip wget
          tools/rootfs/starter/build-all.sh --product boot-base-aarch64 \
            --work "$RUNNER_TEMP/kernarium-boot-work" --output "$GITHUB_WORKSPACE/boot-output"
      - name: Record boot ramdisk checksum
        working-directory: boot-output
        run: |
          gzip -t uml-boot-base-aarch64.cpio.gz
          sha256sum uml-boot-base-aarch64.cpio.gz > uml-boot-base-aarch64.cpio.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kernarium-arm64-boot-base
          path: |
            boot-output/uml-boot-base-aarch64.cpio.gz
            boot-output/uml-boot-base-aarch64.cpio.gz.sha256
          if-no-files-found: error

  simulator:
    name: Build and inspect iOS Simulator app
    needs: boot-base
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ env.KERNARIUM_REV }}
          path: kernarium
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kernarium-arm64-boot-base
          path: build/ios/boot
      - name: Fetch public guest manifest
        run: |
          [[ "$MANIFEST_TAG" =~ ^[0-9A-Za-z._-]+$ ]]
          curl --fail --location --silent --show-error \
            "https://github.com/doublepi123/co_code/releases/download/$MANIFEST_TAG/CoCodeGuest.json" \
            --output build/ios/CoCodeGuest.json
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["compressedSize"] > 0 and m["url"].startswith("https://")' build/ios/CoCodeGuest.json
      - name: Verify build inputs
        id: toolchain
        run: |
          (cd build/ios/boot && shasum -a 256 -c uml-boot-base-aarch64.cpio.gz.sha256)
          xcodebuild -version
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          printf 'sdk=%s\n' "$sdk" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Apple build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install autoconf automake bison flex gettext groff gperf libtool lld llvm make ninja pkgconf rsync
          for package in bison flex gettext groff libtool lld llvm; do
            printf '%s/bin\n' "$(brew --prefix "$package")" >> "$GITHUB_PATH"
          done
          python3 -m pip install meson mako pyyaml packaging
          xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache/restore@v4
        id: kernels
        with:
          path: build/ios/host-kernels
          key: ios-darwin-kernels-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sdk }}
      - uses: actions/cache/restore@v4
        id: sim-gpu
        with:
          path: build/ios/sim-gpu
          key: ios-sim-gpu-v1-${{ env.KERNARIUM_REV }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sdk }}
      - name: Select and boot iPhone simulator
        run: |
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Booted/ {print $2; exit}')
          if [[ -z "$device" ]]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
            xcrun simctl boot "$device"
          fi
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl spawn "$device" defaults write .GlobalPreferences AppleLanguages -array zh-Hans en
          xcrun simctl spawn "$device" defaults write .GlobalPreferences AppleLocale -string zh_CN
          xcrun simctl shutdown "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Build simulator app and run selected tests
        env:
          COCODE_IOS_KERNEL_CACHE_DIR: ${{ github.workspace }}/build/ios/host-kernels
          COCODE_IOS_SIM_GPU_CACHE_DIR: ${{ github.workspace }}/build/ios/sim-gpu
          COCODE_IOS_TEST_ONLY: ${{ env.ONLY_TESTING }}
        run: |
          export BOOT_BASE_SHA256=$(awk 'NR == 1 {print $1}' build/ios/boot/uml-boot-base-aarch64.cpio.gz.sha256)
          export COCODE_IOS_TEST_DESTINATION="platform=iOS Simulator,id=$SIMULATOR_UDID"
          bash ios/host/build-simulator.sh kernarium build/ios/boot \
            build/ios/CoCodeGuest.json build/ios/app
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.kernels.outputs.cache-hit != 'true' && hashFiles('build/ios/host-kernels/*/kernel-artifact.json') != '' }}
        with:
          path: build/ios/host-kernels
          key: ${{ steps.kernels.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.sim-gpu.outputs.cache-hit != 'true' && hashFiles('build/ios/sim-gpu/prefix/lib/libepoxy.a') != '' }}
        with:
          path: build/ios/sim-gpu
          key: ${{ steps.sim-gpu.outputs.cache-primary-key }}
      - name: Capture light and dark first-launch screens
        run: |
          set -euo pipefail
          mkdir -p build/ios/qa/screenshots build/ios/qa/logs
          shot() { xcrun simctl io "$SIMULATOR_UDID" screenshot "build/ios/qa/screenshots/$1-$(printf '%03d' "$2")s.png" >/dev/null; }
          wait_until() { local left=$(( $1 - (SECONDS - started) )); (( left > 0 )) && sleep "$left" || true; }
          capture_appearance() {
            local appearance="$1" until="$2" elapsed
            xcrun simctl uninstall "$SIMULATOR_UDID" io.cocode.ios || true
            xcrun simctl ui "$SIMULATOR_UDID" appearance "$appearance"
            xcrun simctl install "$SIMULATOR_UDID" build/ios/app/Kernarium.app
            xcrun simctl launch --terminate-running-process \
              --stdout="$PWD/build/ios/qa/logs/$appearance-app-stdout.log" \
              --stderr="$PWD/build/ios/qa/logs/$appearance-app-stderr.log" \
              "$SIMULATOR_UDID" io.cocode.ios
            started=$SECONDS
            # The first seconds show the download and install panels, then Cox opening.
            for elapsed in 1 2 3 4 5 6 7 8 12 20 40; do wait_until "$elapsed"; shot "$appearance" "$elapsed"; done
            for (( elapsed = 60; elapsed <= until; elapsed += 60 )); do wait_until "$elapsed"; shot "$appearance" "$elapsed"; done
            xcrun simctl terminate "$SIMULATOR_UDID" io.cocode.ios || true
          }
          capture_appearance light 600
          capture_appearance dark 120
      - name: Collect test results
        if: always()
        run: |
          mkdir -p build/ios/qa/logs build/ios/qa/test-attachments
          if [[ -d build/ios/app/KernariumTests.xcresult ]]; then
            mv build/ios/app/KernariumTests.xcresult build/ios/qa/
            cp build/ios/app/KernariumTests-xcodebuild.log build/ios/qa/logs/ || true
            xcrun xcresulttool get test-results summary --path build/ios/qa/KernariumTests.xcresult --format json \
              | python3 -m json.tool > build/ios/qa/logs/KernariumTests-summary.txt || true
            xcrun xcresulttool export attachments --path build/ios/qa/KernariumTests.xcresult \
              --output-path build/ios/qa/test-attachments || true
          else
            printf 'No test results: no tests were selected or the build failed.\n' > build/ios/qa/logs/KernariumTests-summary.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CoCode-iOS-simulator-qa
          path: build/ios/qa/
          if-no-files-found: error
          retention-days: 14
      - name: Fail when the selected tests failed
        if: ${{ env.ONLY_TESTING != '' }}
        run: |
          status=$(cat build/ios/app/KernariumTests.status)
          [[ "$status" == 0 ]] || { echo "Selected Kernarium tests failed with status $status"; exit 1; }
